<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Planner</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        primaryHover: '#4338CA', // Indigo 700
                        surface: '#ffffff',
                        background: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Phosphor Icons for modern icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-background text-gray-900 font-sans min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col">
        <!-- App content will be injected here -->
    </div>

    <!-- State Management -->
    <script src="js/services/aiService.js"></script>
    <script src="js/store/state.js"></script>
    
    <!-- Components -->
    <script src="js/components/Header.js"></script>
    <script src="js/components/Dashboard.js"></script>
    <script src="js/components/CreatePlan.js"></script>
    <script src="js/components/PlanPreview.js"></script>
    
    <!-- Main Application Logic -->
    <script src="js/app.js"></script>
</body>
</html>
